<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Afterlight</title>
<style>
/* Workbench design tokens */
:root {
  --background: #ffffff; --surface: #f3f3f3; --surface-hover: #e9e9e9; --control: #ffffff;
  --text: #111111; --muted: #666666; --border: #d6d6d6; --border-control: #8a8a8a;
  --accent: #080808; --accent-text: #ffffff; --accent-hover: #333333;
  --positive: #137a42; --negative: #c03a3a; --warning: #9a5d00;
  --shadow-dropdown: 0 8px 22px #00000022;
  --radius: 10px; --radius-item: 8px; --radius-field: 6px;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --bar-h: 52px; --drawer-l: 340px; --drawer-r: 360px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --background: #0d0d0d; --surface: #171717; --surface-hover: #242424; --control: #0a0a0a;
  --text: #f5f5f5; --muted: #a3a3a3; --border: #353535; --border-control: #6b6b6b;
  --accent: #f5f5f5; --accent-text: #0a0a0a; --accent-hover: #d4d4d4;
  --positive: #43c982; --negative: #ff7777; --warning: #d18a3c;
  --shadow-dropdown: 0 8px 22px #00000066; color-scheme: dark;
}}
:root[data-theme="dark"] {
  --background: #0d0d0d; --surface: #171717; --surface-hover: #242424; --control: #0a0a0a;
  --text: #f5f5f5; --muted: #a3a3a3; --border: #353535; --border-control: #6b6b6b;
  --accent: #f5f5f5; --accent-text: #0a0a0a; --accent-hover: #d4d4d4;
  --positive: #43c982; --negative: #ff7777; --warning: #d18a3c;
  --shadow-dropdown: 0 8px 22px #00000066; color-scheme: dark;
}
/* Operation → data color: only writes are colored */
:root { --delete: var(--negative); --create: var(--positive); --edit: var(--warning); --read: var(--text);
  --list: var(--muted); --search: var(--muted); --hit: var(--border-control); --ref: var(--border-control); }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { background: var(--background); color: var(--text); font: 14px/1.6 var(--sans); }
button, select, input[type="search"] { font: 500 13px/1.4 var(--sans); color: var(--text); background: var(--control); border: 1px solid var(--border-control);
  border-radius: var(--radius-field); padding: 4px 10px; transition: background-color .15s, color .15s; }
button, select { cursor: pointer; }
button:hover { background: var(--surface-hover); }
button:focus-visible, select:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
button.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.ib { width: 28px; height: 28px; padding: 0; display: inline-grid; place-items: center; flex: none; }
.ib.ghost { border-color: transparent; background: transparent; }
.ib.ghost:hover { background: var(--surface-hover); }
svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.mono { font-family: var(--mono); }
.cap { font-size: 12px; line-height: 1.8; color: var(--muted); }
.micro { font-size: 11px; line-height: 1.4; color: var(--muted); }

/* ---------- Canvas */
#canvas { position: fixed; inset: 0; overflow: hidden; cursor: grab; touch-action: none; background-color: var(--background);
  background-image: radial-gradient(circle, var(--border) 1px, transparent 1.3px); }
#canvas.drag { cursor: grabbing; }
#cv { width: 100%; height: 100%; display: block; user-select: none; }
#cvVp { transform-box: view-box; transform-origin: 0 0; }
#cvVp.anim { transition: transform .45s ease; }
.cn { transform-box: view-box; transform-origin: 0 0; transition: transform .38s ease, opacity .38s; cursor: pointer; }
.cn .card { fill: var(--control); stroke: var(--border); stroke-width: 1; }
.cn:hover .card { fill: var(--surface-hover); }
.cn.sel .card { stroke: var(--muted); stroke-width: 1.5; }
.cn.cur .card { stroke: var(--text); stroke-width: 2; }
.cn.ghost .card { stroke-dasharray: 4 3; }
.cn.ghost .lbl { text-decoration: line-through; opacity: .5; }
.cn.fresh .card { animation: pulse 1.6s ease-out; }
@keyframes pulse { 0% { stroke: var(--warning); stroke-width: 3; } 100% { stroke-width: 1; } }
.cn .lbl { font: 400 12px var(--sans); fill: var(--text); dominant-baseline: central; }
.cn.dirn .lbl { font-weight: 600; }
.cn .bdg text { font: 10px var(--mono); dominant-baseline: central; text-anchor: middle; }
.cn .heatb { fill: var(--muted); opacity: .4; }
.cn .tg circle { fill: var(--control); stroke: var(--border-control); }
.cn .tg:hover circle { fill: var(--surface-hover); }
.cn .tg text { font: 600 10px var(--mono); fill: var(--text); text-anchor: middle; dominant-baseline: central; }
.cn.session .card { fill: var(--accent); stroke: none; }
.cn.session:hover .card { fill: var(--accent-hover); }
.cn.session.sel .card { stroke: var(--warning); stroke-width: 2; }
.cn.session.lib .card { fill: var(--control); stroke: var(--border-control); stroke-dasharray: 5 3; }
.cn.session .st { font: 600 13px var(--sans); fill: var(--accent-text); dominant-baseline: central; }
.cn.session .ss { font: 400 11px var(--sans); fill: var(--accent-text); opacity: .68; dominant-baseline: central; }
.cn.session.lib .st, .cn.session.lib .ss { fill: var(--text); }
.livedot { fill: var(--positive); }
.cn .pulse { fill: none; stroke: var(--positive); animation: ring 1.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes ring { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(2.6); } }
.edge { fill: none; transition: d .38s ease, opacity .38s; }
#empty { position: fixed; left: 50%; top: 44%; transform: translate(-50%, -50%); text-align: center; display: none; max-width: 360px; }
#empty h2 { font-size: 21px; line-height: 1.4; font-weight: 600; margin: 0 0 4px; }

/* ---------- Taskbar: the single entry point for everything */
#bar { position: fixed; z-index: 20; left: 16px; right: 16px; bottom: 16px; height: var(--bar-h); display: flex; align-items: center; gap: 2px;
  padding: 0 8px; background: var(--control); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-dropdown); }
.grp { display: flex; align-items: center; gap: 2px; flex: none; }
.vsep { width: 1px; height: 24px; background: var(--border); margin: 0 6px; flex: none; }
.tb { height: 34px; display: inline-flex; align-items: center; gap: 7px; padding: 0 10px; border-color: transparent; background: transparent; white-space: nowrap; }
.tb:hover { background: var(--surface-hover); }
.tb.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.tb .n { font-size: 11px; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
.tb.on .n { color: var(--accent-text); opacity: .7; }
.tb.icon { width: 34px; padding: 0; justify-content: center; }
.tb .dotf { width: 6px; height: 6px; border-radius: 50%; background: var(--warning); display: none; }
.tb.mod .dotf { display: inline-block; }
#tl { flex: 1; min-width: 120px; display: flex; align-items: center; gap: 10px; padding: 0 4px; }
#play { width: 30px; height: 30px; padding: 0; border-radius: 50%; display: grid; place-items: center; flex: none;
  background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
#play:hover { background: var(--accent-hover); }
#play svg { width: 12px; height: 12px; fill: currentColor; }
#strip { flex: 1; min-width: 60px; height: 30px; cursor: ew-resize; display: block; border-radius: 4px; touch-action: none; }
#clock { font-size: 11px; line-height: 1.4; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
#liveBtn { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; padding: 3px 9px; font-size: 12px; }
#liveBtn i { width: 7px; height: 7px; border-radius: 50%; background: var(--border-control); }
#liveBtn.on { background: var(--control); color: var(--text); border-color: var(--border-control); }
#liveBtn.on i { background: var(--positive); }
#zoomPct { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 40px; text-align: center; }
#langBtn { font-size: 12px; min-width: 34px; }

/* ---------- Drawers: open from the taskbar, sit above it */
.drawer { position: fixed; z-index: 15; top: 16px; bottom: calc(var(--bar-h) + 32px); display: none; flex-direction: column;
  background: var(--control); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-dropdown); }
.drawer.open { display: flex; }
#drawerL { left: 16px; width: var(--drawer-l); }
#drawerR { right: 16px; width: var(--drawer-r); }
.dh { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 14px; border-bottom: 1px solid var(--border); flex: none; min-height: 44px; }
.dt { font-size: 13px; line-height: 1.4; font-weight: 600; white-space: nowrap; }
.ds { font-size: 11px; line-height: 1.4; color: var(--muted); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.db { overflow: auto; min-height: 0; flex: 1; }
.pad { padding: 12px 14px 14px; }

/* Filters popover */
#filters { position: fixed; z-index: 25; bottom: calc(var(--bar-h) + 24px); width: 300px; padding: 14px; display: none;
  background: var(--control); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-dropdown); }
#filters.open { display: block; }
.label { font-size: 12px; line-height: 1.4; margin: 14px 0 8px; }
.label:first-child { margin-top: 0; }
#chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: var(--radius-field); border: 1px solid var(--border-control);
  font-size: 12px; cursor: pointer; user-select: none; background: var(--control); }
.chip i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.chip.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
#agentSel { width: 100%; }
.check { display: flex; align-items: center; gap: 8px; font-size: 12px; cursor: pointer; margin-top: 6px; }
.check input { accent-color: var(--accent); margin: 0; }

/* Sessions */
.libsearch { padding: 10px 10px 0; position: sticky; top: 0; background: var(--control); z-index: 1; padding-bottom: 6px; }
.libsearch input { width: 100%; font-weight: 400; }
.sgroup { font-size: 11px; line-height: 1.4; color: var(--muted); padding: 12px 14px 4px; }
.srow { display: flex; align-items: center; gap: 10px; padding: 7px 6px 7px 12px; cursor: pointer; border-radius: var(--radius-item); margin: 2px 4px; }
.srow:hover { background: var(--surface-hover); }
.srow.sel { background: var(--surface); outline: 1px solid var(--muted); }
.srow.off .smain { opacity: .5; }
.smain { flex: 1; min-width: 0; }
.stitle { font-size: 13px; line-height: 1.5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srow .micro { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sdot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.sdot.live { background: var(--positive); box-shadow: 0 0 0 3px color-mix(in srgb, var(--positive) 25%, transparent); }
.sdot.idle { border: 1.5px solid var(--positive); }
.sdot.lib { background: var(--border-control); }
.empty { color: var(--muted); padding: 18px 14px; font-size: 12px; line-height: 1.8; }
.more { padding: 8px 14px 12px; font-size: 11px; color: var(--muted); }

/* Inspector */
.ihead h2 { font-size: 14px; line-height: 1.5; font-weight: 600; margin: 0; word-break: break-all; }
.acts { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.sec { font-size: 12px; line-height: 1.4; font-weight: 600; margin: 18px 0 8px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 8px; }
.stat b { display: block; font-size: 16px; line-height: 1.3; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--muted); }
.kv { font-size: 12px; line-height: 1.6; word-break: break-all; }
.kv .micro { display: block; }
.prompt { padding: 8px 0; border-top: 1px solid var(--border); font-size: 13px; line-height: 1.6; }
.prompt:first-of-type { border-top: 0; }
.ev { border-top: 1px solid var(--border); padding: 10px 0; }
.ev:first-child { border-top: 0; }
.ev .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 11px; line-height: 1.4; color: var(--muted); }
.ev code { display: block; font: 11px/1.5 var(--mono); white-space: pre-wrap; word-break: break-all; margin-top: 6px; color: var(--text);
  background: var(--surface); border-radius: var(--radius-field); padding: 6px 8px; }
.bd { display: inline-block; font: 10px/15px var(--mono); padding: 0 5px; border-radius: 4px; color: var(--c); border: 1px solid var(--c); white-space: nowrap; }
.inf { border: 1px dashed var(--border-control); color: var(--muted); border-radius: 4px; padding: 0 4px; font-size: 10px; }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; font-size: 12px; }

/* Outline */
#outline { padding: 6px; }
.node { display: flex; align-items: center; gap: 6px; padding: 2px 6px; border-radius: var(--radius-field); cursor: pointer; white-space: nowrap; font-size: 13px; }
.node:hover { background: var(--surface-hover); }
.node.sel { background: var(--surface); outline: 1px solid var(--muted); }
.node.sess { font-weight: 600; margin-top: 6px; }
.tw { width: 12px; color: var(--muted); font-size: 10px; flex: none; text-align: center; }
.nm { overflow: hidden; text-overflow: ellipsis; }
.dir > .nm { font-weight: 600; }
.ghost > .nm { text-decoration: line-through; opacity: .5; }
.badges { display: inline-flex; gap: 3px; margin-left: 4px; }
.heat { margin-left: auto; height: 2px; border-radius: 1px; background: var(--muted); opacity: .4; flex: none; }
.fresh { animation: flash 1.2s ease-out; }
@keyframes flash { from { background: var(--surface-hover); } }
.kids { margin-left: 12px; border-left: 1px solid var(--border); padding-left: 3px; }
.osec { margin: 8px 6px 2px; color: var(--muted); font-size: 11px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media (max-width: 1240px) { .grp.right .lbl { display: none; } .grp.right .tb:not(.icon) { padding: 0 9px; } }
@media (max-width: 960px) { .grp.left .lbl { display: none; } #zoomPct, #expandBtn, #collapseBtn { display: none; } }
@media (max-width: 760px) {
  :root { --bar-h: 48px; }
  #bar { left: 8px; right: 8px; bottom: 8px; padding: 0 4px; }
  .vsep { margin: 0 2px; }
  .tb { padding: 0 8px; }
  #clock, #zIn, #zOut, #zoomPct, #expandBtn, #collapseBtn, .grp.right .vsep { display: none !important; }
  #bar { overflow-x: auto; scrollbar-width: none; }
  #bar::-webkit-scrollbar { display: none; }
  #tl { min-width: 130px; gap: 6px; }
  #liveBtn span { display: none; }
  #liveBtn { padding: 3px 7px; }
  .drawer { left: 8px !important; right: 8px !important; width: auto !important; top: auto; height: 58vh; bottom: calc(var(--bar-h) + 16px); }
  #filters { left: 8px !important; right: 8px; width: auto; }
  .cn .tg circle { r: 11; }
}
</style>
</head>
<body>
<div id="canvas"><svg id="cv"><g id="cvVp"><g id="cvEdges"></g><g id="cvNodes"></g></g></svg></div>
<div id="empty"><h2 data-i18n="emptyTitle"></h2><div class="cap" id="emptyDesc"></div>
  <div class="acts" style="justify-content:center"><button id="openLib" data-i18n="openLibrary"></button></div></div>

<svg width="0" height="0" style="position:absolute">
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></symbol>
  <symbol id="i-inbox" viewBox="0 0 24 24"><path d="M4 13l2.5-8h11L20 13v6H4z"/><path d="M4 13h4.5l1 2h5l1-2H20"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></symbol>
  <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 5h16l-6.2 7.5V19l-3.6-1.8v-4.7z"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-eyeoff" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.1A9.9 9.9 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3 3.8M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a9.6 9.6 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 17v5M8 3h8l-1 7 3 3v2H6v-2l3-3z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"/></symbol>
  <symbol id="i-collapse" viewBox="0 0 24 24"><path d="M8 5l4 4 4-4M8 19l4-4 4 4"/></symbol>
  <symbol id="i-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></symbol>
</svg>

<aside class="drawer" id="drawerL">
  <div class="dh"><span class="dt" id="dlTitle"></span><span class="ds" id="dlSum"></span>
    <button class="ib ghost" data-close="left" data-i18n-title="close"><svg class="i"><use href="#i-close"/></svg></button></div>
  <div class="db"><div id="sessList"></div><div id="outline"></div></div>
</aside>

<aside class="drawer" id="drawerR">
  <div class="dh"><span class="dt" data-i18n="inspector"></span><span class="ds" id="drSum"></span>
    <button class="ib ghost" data-close="right" data-i18n-title="close"><svg class="i"><use href="#i-close"/></svg></button></div>
  <div class="db pad" id="inspector"></div>
</aside>

<div id="filters">
  <div class="label" data-i18n="opTypes"></div>
  <div id="chips"></div>
  <div class="label" data-i18n="agent"></div>
  <select id="agentSel"><option value="*" data-i18n="agentAll"></option><option value="main" data-i18n="agentMain"></option><option value="sub" data-i18n="agentSub"></option></select>
  <div class="label" data-i18n="data"></div>
  <label class="check"><input type="checkbox" id="tgInf" checked><span data-i18n="incInferred"></span></label>
  <label class="check"><input type="checkbox" id="tgGhost"><span data-i18n="showGhost"></span></label>
  <label class="check"><input type="checkbox" id="tgFollow" checked><span data-i18n="follow"></span></label>
</div>

<nav id="bar">
  <div class="grp left">
    <button class="tb" id="tbActive" data-left="active"><svg class="i"><use href="#i-grid"/></svg><span class="lbl" id="tbActiveLbl"></span><span class="n" id="nActive"></span></button>
    <button class="tb" id="tbLib" data-left="library"><svg class="i"><use href="#i-inbox"/></svg><span class="lbl" data-i18n="library"></span><span class="n" id="nLib"></span></button>
    <button class="tb" id="tbOutline" data-left="outline"><svg class="i"><use href="#i-list"/></svg><span class="lbl" data-i18n="outline"></span></button>
  </div>
  <span class="vsep"></span>
  <div id="tl">
    <button id="play" data-i18n-title="play"></button>
    <svg id="strip" preserveAspectRatio="none"></svg>
    <span id="clock"></span>
    <button id="liveBtn" data-i18n-title="liveTip"><i></i><span></span></button>
  </div>
  <span class="vsep"></span>
  <div class="grp right">
    <button class="tb" id="tbFilter"><svg class="i"><use href="#i-filter"/></svg><span class="lbl" data-i18n="filters"></span><span class="dotf"></span></button>
    <button class="tb" id="tbInspector"><svg class="i"><use href="#i-info"/></svg><span class="lbl" data-i18n="inspector"></span></button>
    <span class="vsep"></span>
    <button class="tb icon" id="zOut" data-i18n-title="zoomOut"><svg class="i"><use href="#i-minus"/></svg></button>
    <span id="zoomPct">100%</span>
    <button class="tb icon" id="zIn" data-i18n-title="zoomIn"><svg class="i"><use href="#i-plus"/></svg></button>
    <button class="tb icon" id="zFit" data-i18n-title="fit"><svg class="i"><use href="#i-fit"/></svg></button>
    <button class="tb icon" id="expandBtn" data-i18n-title="expandAll"><svg class="i"><use href="#i-expand"/></svg></button>

// ---------------------------------------------------------------- File tree

function renderOutline(groups, total, fresh) {

    row.onclick = () => { select(g.key); follow(g.key, true); };

      host.appendChild(nodeEl(r.node, r.label, total, fresh, r.def));
    }

    + (!isDir && n.evs.length && !n.evs.some(e => e.exists) ? " ghost" : "") + (fresh.has(n.path) ? " fresh" : "");
  const open = isDir && isOpen(n.path, defOpen);

    + `<span class="nm" style="color:${!isDir ? color(strongest) : "inherit"}" title="${esc(realOf(n.path))}">${esc(label)}</span>`
    + `<span class="badges">${badgeList(n, isDir).map(b => `<span class="bd" style="--c:${color(b.o)}" title="${opName(b.o)} × ${n.ops[b.o]}">${b.t}</span>`).join("")}</span>`

      + fevs.slice().reverse().slice(0, 300).map(e => `<div class="ev"><div class="meta">
        <span class="bd" style="--c:${color(e.op)}">${opName(e.op)}</span><span class="mono">${fmtDT(e.ts)}</span>
        <span>${esc(e.tool)}</span>${e.agent !== "main" ? `<span>${esc(e.agent)}</span>` : ""}${e.conf !== "exact" ? `<span class="inf">${t("inferred")}</span>` : ""}
        </div>${e.key !== sel ? `<div class="micro" style="margin-top:4px">${esc(e.key.slice(sel.length + 1))}</div>` : ""}<code>${esc(e.detail || "")}</code></div>`).join("")
      + (fevs.length ? "" : `<div class="cap">${t("noEventsHere")}</div>`) + `</div>`;
  }
}
function onInspectorClick(e) {
  const b = e.target.closest("[data-iact]"); if (!b) return;
  const s = state.sel && S.sessions.get(sidOf(state.sel));
  const a = b.dataset.iact;
  if (a === "clear") { state.sel = null; render(); renderSessions(); }
  else if (a === "focus") follow(deepestVisible(state.sel), true);
  else if (a === "hide" && s) { S.hidden.has(s.id) ? S.hidden.delete(s.id) : S.hidden.add(s.id); store.set("hidden", [...S.hidden]); rebuild(); renderSessions(); }
  else if (a === "pin" && s) togglePin(s);
}

// ---------------------------------------------------------------- Timeline (lives in the taskbar)
function renderClock() {
  const e = EV[state.cursor];
  $("#clock").textContent = e ? `${state.cursor + 1}/${EV.length} · ${fmtDT(e.ts)}` : t("noEvents");
  const m = $("#strip").querySelector("#cur");
  if (m) m.setAttribute("x", state.cursor);
  const lb = $("#liveBtn");
  lb.style.display = LIVE ? "" : "none";
  lb.classList.toggle("on", state.live);
  lb.querySelector("span").textContent = state.live ? t("live") : t("backToLive");
}
function renderStrip() {
  const n = Math.max(EV.length, 1), svg = $("#strip");
  svg.setAttribute("viewBox", `0 0 ${n} 30`);
  let h = `<rect x="0" y="0" width="${n}" height="30" style="fill:var(--surface)"/>`;
  for (const e of EV) {
    const w = ["edit", "create", "delete"].includes(e.op);
    h += `<rect x="${e.seq}" y="${w ? 6 : 17}" width="${Math.max(1, n / 600)}" height="${w ? 8 : 7}" style="fill:${color(e.op)}" opacity="${w ? 1 : e.conf === "exact" ? .5 : .28}"/>`;
  }
  for (const s of visibleSessions()) for (const p of (s.data && s.data.meta.prompts) || []) {
    const i = EV.findIndex(e => e.ts >= p.ts); if (i < 0) continue;
    h += `<rect x="${i}" y="0" width="${Math.max(1, n / 400)}" height="30" style="fill:var(--muted)" opacity=".35"><title>${esc(p.text)}</title></rect>`;
  }
  h += `<rect id="cur" x="${state.cursor}" y="0" width="${Math.max(1, n / 250)}" height="30" style="fill:var(--text)"/>`;
  svg.innerHTML = h;
}
function seek(i) {
  state.cursor = Math.max(0, Math.min(EV.length - 1, i));
  state.live = state.cursor >= EV.length - 1 && !state.playing;
  state.cursorTs = EV[state.cursor] ? EV[state.cursor].ts : null;
  render();
}
function goLive() { if (state.playing) play(); state.live = true; seek(EV.length - 1); }
const ICON_PLAY = `<svg viewBox="0 0 14 14"><path d="M3 1.5v11l9-5.5z"/></svg>`;
const ICON_PAUSE = `<svg viewBox="0 0 14 14"><rect x="2.5" y="1.5" width="3" height="11" rx="1"/><rect x="8.5" y="1.5" width="3" height="11" rx="1"/></svg>`;
function play() {
  if (state.playing) { clearInterval(state.playing); state.playing = null; $("#play").innerHTML = ICON_PLAY; seek(state.cursor); return; }
  if (!EV.length) return;
  if (state.cursor >= EV.length - 1) state.cursor = 0;
  $("#play").innerHTML = ICON_PAUSE;
  const step = Math.max(1, Math.round(EV.length / 300));
  state.playing = setInterval(() => {
    if (state.cursor + step >= EV.length - 1) { play(); return goLive(); }
    seek(state.cursor + step);
  }, 60);
}
function initStrip() {
  const svg = $("#strip");
  const at = ev => { const r = svg.getBoundingClientRect(); return Math.round((ev.clientX - r.left) / r.width * (EV.length - 1)); };
  let dragging = false;
  svg.addEventListener("pointerdown", ev => { if (state.playing) play(); dragging = true; svg.setPointerCapture(ev.pointerId); seek(at(ev)); });
  svg.addEventListener("pointermove", ev => { if (dragging) seek(at(ev)); });
  svg.addEventListener("pointerup", () => { dragging = false; });
}

// ---------------------------------------------------------------- Chrome: taskbar + drawers + popover
function setUI(patch) {
  Object.assign(ui, patch);
  if (MOBILE()) {  // Phone: one drawer at a time
    if (patch.left) ui.right = false;
    if (patch.right) ui.left = null;
  }
  store.set(UIKEY, { left: ui.left, right: ui.right });
  renderChrome();
  renderSessions(); render();
}
function renderChrome() {
  const vis = visibleSessions();
  $("#tbActiveLbl").textContent = LIVE ? t("active") : t("session");
  $("#nActive").textContent = LIVE ? S.active.length : "";
  $("#nLib").textContent = S.libraryTotal || "";
  $("#tbLib").style.display = LIVE ? "" : "none";
  document.querySelectorAll("[data-left]").forEach(b => b.classList.toggle("on", ui.left === b.dataset.left));
  $("#tbInspector").classList.toggle("on", !!ui.right);
  $("#tbFilter").classList.toggle("on", !!ui.filters);
  $("#tbFilter").classList.toggle("mod", state.ops.size !== 6 || !state.ops.has("edit") || !state.inf || state.ghost || state.agent !== "*");
  $("#drawerL").classList.toggle("open", !!ui.left);
  $("#drawerR").classList.toggle("open", !!ui.right);
  $("#filters").classList.toggle("open", !!ui.filters);
  if (ui.left) {
    const titles = { active: LIVE ? t("active") : t("session"), library: t("library"), outline: t("outline") };
    $("#dlTitle").textContent = titles[ui.left];
    $("#dlSum").textContent = ui.left === "active" ? (LIVE ? t("onCanvas", { n: vis.length }) : "") : ui.left === "library" ? String(S.libraryTotal) : t("paths", { n: lastPaths });
    $("#sessList").style.display = ui.left === "outline" ? "none" : "";
    $("#outline").style.display = ui.left === "outline" ? "" : "none";
  }
  if (ui.filters) positionFilters();
}
function positionFilters() {
  if (MOBILE() || !ui.filters) return;
  const b = $("#tbFilter").getBoundingClientRect(), f = $("#filters");
  f.style.left = Math.max(16, Math.min(innerWidth - 316, b.left + b.width / 2 - 150)) + "px";
}
function renderChips() {
  $("#chips").innerHTML = OPS.map(o => `<span class="chip${state.ops.has(o) ? " on" : ""}" data-op="${o}" role="button" tabindex="0"><i style="background:${color(o)}"></i>${opName(o)}</span>`).join("");
}
let savedUI = null;
function toggleChrome() {
  if (ui.left || ui.right || ui.filters) { savedUI = { left: ui.left, right: ui.right }; setUI({ left: null, right: false, filters: false }); }
  else setUI(savedUI || { left: "active", right: true });
}

// ---------------------------------------------------------------- Boot
function init() {
  applyStaticText();
  $("#play").innerHTML = ICON_PLAY;
  $("#play").onclick = play;
  $("#liveBtn").onclick = goLive;
  initStrip();
  document.querySelectorAll("[data-left]").forEach(b => b.onclick = () => setUI({ left: ui.left === b.dataset.left ? null : b.dataset.left }));
  $("#tbInspector").onclick = () => setUI({ right: !ui.right });
  $("#tbFilter").onclick = () => setUI({ filters: !ui.filters });
  document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => setUI(b.dataset.close === "left" ? { left: null } : { right: false }));
  $("#chips").onclick = e => { const c = e.target.closest(".chip"); if (!c) return;
    const o = c.dataset.op; state.ops.has(o) ? state.ops.delete(o) : state.ops.add(o); c.classList.toggle("on"); render(); };
  $("#agentSel").onchange = e => { state.agent = e.target.value; render(); };
  $("#tgInf").onchange = e => { state.inf = e.target.checked; render(); };
  $("#tgGhost").onchange = e => { state.ghost = e.target.checked; render(); };
  $("#sessList").onclick = onSessionClick;
  $("#inspector").onclick = onInspectorClick;
  $("#openLib").onclick = () => setUI({ left: "library" });
  initCanvas();
  $("#expandBtn").onclick = () => { cv.needFit = true; EV.forEach(e => { let p = ""; e.key.split("/").filter(Boolean).forEach(x => { p += "/" + x; state.open.add(p); }); }); render(); };
  $("#collapseBtn").onclick = () => { state.open = new Set([...state.open].filter(k => k.startsWith("!"))); cv.needFit = true; render(); };
  $("#theme").onclick = () => { const r = document.documentElement; const dark = matchMedia("(prefers-color-scheme: dark)").matches;
    const cur = r.dataset.theme || (dark ? "dark" : "light"); r.dataset.theme = cur === "dark" ? "light" : "dark"; renderStrip(); };
  $("#langBtn").onclick = () => { LANG = LANG === "en" ? "zh" : "en"; store.set("lang", LANG); applyStaticText(); renderSessions(); render(); };
  document.addEventListener("keydown", e => {
    const tg = e.target;
    if (tg.tagName === "SELECT" || (tg.tagName === "INPUT" && !["range", "checkbox"].includes(tg.type))) return;
    if (e.key === " ") { e.preventDefault(); play(); }
    else if (e.key === "ArrowLeft") seek(state.cursor - 1);
    else if (e.key === "ArrowRight") seek(state.cursor + 1);
    else if (e.key === "f" || e.key === "F") fit();
    else if (e.key === "l" || e.key === "L") goLive();
    else if (e.key === "\\") toggleChrome();
    else if (e.key === "Escape") { if (ui.filters) setUI({ filters: false }); else { state.sel = null; render(); renderSessions(); } }
  });
  renderChrome();

  if (!LIVE) {
    for (const x of DATA.sessions) { const s = upsert({ ...x }); S.home = x.data.meta.home; openDefaults(s); }
    if (ui.left === "library") ui.left = "active";
    renderSessions(); rebuild();
    return;
  }
  loadList().catch(err => { $("#sessList").innerHTML = `<div class="empty">${esc(t("loadFail", { e: err.message }))}</div>`; });
  const es = new EventSource("/api/stream");
  es.addEventListener("sessions", () => loadList());
  es.addEventListener("changed", e => {
    for (const id of JSON.parse(e.data).ids) { const s = S.sessions.get(id); if (s && visibleSessions().includes(s)) ensureData(s, true); }
  });
  setInterval(() => { loadList(); }, 60000);  // refresh "n min ago" and the 30-minute active → library switch
}
init();
</script>
</body>
